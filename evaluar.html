<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Rueda de tu vida</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --blue:#1e5aa8; --ink:#14223a; --muted:#6b7690; --line:#e3e8f0; }
    * { box-sizing: border-box; }
    body { margin:0; background:#f3f5f9; font-family:'IBM Plex Sans',system-ui,sans-serif; color:var(--ink); }
    .wrap { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
    h1 { font-size:24px; margin:0 0 6px; letter-spacing:-.4px; }
    p.lead { margin:0 0 20px; color:var(--muted); font-size:14.5px; line-height:1.5; }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:12px; }
    .area-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
    .area-name { font-weight:600; font-size:15px; }
    .area-hint { font-size:12.5px; color:var(--muted); margin-bottom:10px; line-height:1.4; }
    .val { font-weight:700; font-size:20px; color:var(--blue); min-width:28px; text-align:right; }
    .val.unset { color:#b6bfce; }
    input[type=range] { width:100%; accent-color:var(--blue); height:28px; }
    textarea { width:100%; border:1px solid var(--line); border-radius:10px; padding:10px; font:inherit; resize:vertical; }
    button { width:100%; background:var(--blue); color:#fff; border:0; border-radius:12px; padding:14px; font:inherit; font-weight:700; font-size:16px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    .err { background:#fbeef1; color:#9a3b52; border-radius:10px; padding:10px 12px; font-size:13.5px; margin:10px 0; }
    .ok { text-align:center; padding:36px 16px; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="wrap" id="app"><p class="lead">Cargando…</p></div>
  <script type="module" src="js/evaluar.js"></script>
</body>
</html>
